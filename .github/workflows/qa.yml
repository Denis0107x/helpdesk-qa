name: HelpDesk autotests
on: [push, pull_request]

jobs:
  unit-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Используем ОФИЦИАЛЬНЫЙ экшен Cypress — он сам всё настроит
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          install-command: npm install
          start: npm run start:test
          wait-on: 'http://127.0.0.1:3000/api/health'
          wait-on-timeout: 30