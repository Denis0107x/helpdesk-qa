name: HelpDesk autotests
on: [push, pull_request]

jobs:
  unit-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Шаг 1: Запускаем сервер в фоне
      - name: Start test server
        run: |
          npm install
          npm run start:test &
          
      # Шаг 2: Даем серверу время на запуск (ожидание health-check)
      - name: Wait for server
        run: |
          npx wait-on http://127.0.0.1:3000/api/health --timeout 30000
          
      # Шаг 3: Запускаем тесты Cypress
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          install: false
          wait-on: 'http://127.0.0.1:3000'
          wait-on-timeout: 60